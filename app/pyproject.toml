[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sageroad"
version = "1.0.9"
description = "SageRoad engineers low-volume roads on USGS lidar terrain and views the resulting road plans"
readme = "PYPI.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["road", "grading", "lidar", "civil engineering"]
authors = [
    {name = "Craig A. Hobbs"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering"
]
dependencies = [
    "chisel >= 2.5.0, < 2.6.0",
    "waitress >= 3.0.0"
]

[project.urls]
Homepage = "https://github.com/craigahobbs/sageroad"

[project.scripts]
sageroad = "sageroad.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sageroad", "sageroad.*"]

[tool.setuptools.package-data]
sageroad = ["static/**/*"]
